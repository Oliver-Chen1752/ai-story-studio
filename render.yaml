# Render 免费部署蓝图：把本仓库连到 Render 后，此文件会被自动识别
# 前端在构建阶段用 Vite 打包，产物由 Flask 单端口托管
services:
  - type: web
    name: ai-story-studio
    runtime: python
    plan: free
    buildCommand: |
      pip install -r backend/requirements.txt
      cd frontend && npm ci && npm run build
    startCommand: cd backend && gunicorn -w 1 --timeout 240 app:app
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false        # 在 Render 控制台填，不进仓库
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: DEEPSEEK_THINKING
        value: disabled
      - key: PYTHON_VERSION
        value: 3.11.9
